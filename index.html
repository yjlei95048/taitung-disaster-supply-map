        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        }).addTo(map);

// 暫存目前可選路線
var currentRouteItems = [];

// 產生左側路線 checkbox 清單
function updateRouteCheckboxList() {
    var selectedTown = document.getElementById("townSelect").value;
    var selectedRoute = document.getElementById("routeSelect").value;
    var listBox = document.getElementById("routeCheckboxList");

    listBox.innerHTML = "";
    currentRouteItems = [];

    if (selectedRoute === "不顯示") {
        listBox.innerHTML = '<span style="color:#777;">目前設定為不顯示路線</span>';
        applyFilters();
        return;
    }

    routeLayerGroups.forEach(function(routeGroup) {
        if (selectedRoute !== "全部" && selectedRoute !== routeGroup.type) {
            return;
        }

        routeGroup.layer.eachLayer(function(featureLayer) {
            var props = featureLayer.feature && featureLayer.feature.properties ? featureLayer.feature.properties : {};

            var townValue = props["鄉鎮市"];
            var fromValue = props["FROM_ID"];
            var toValue = props["TO_ID"];
            var distValue = props["DIST_KM"];

            var townMatch = (selectedTown === "全部" || townValue === selectedTown);

            if (townMatch) {
                var routeKey = routeGroup.type + "||" + fromValue + "||" + toValue;

                currentRouteItems.push({
                    key: routeKey,
                    layer: featureLayer,
                    type: routeGroup.type,
                    town: townValue,
                    from: fromValue,
                    to: toValue,
                    dist: distValue
                });
            }
        });
    });

    if (currentRouteItems.length === 0) {
        listBox.innerHTML = '<span style="color:#777;">無符合條件的路線</span>';
        applyFilters();
        return;
    }

    // 全選 / 全部取消控制
    var controlDiv = document.createElement("div");
    controlDiv.style.marginBottom = "8px";
    controlDiv.innerHTML = `
        <button type="button" id="checkAllRoutes">全選</button>
        <button type="button" id="uncheckAllRoutes">全部取消</button>
    `;
    listBox.appendChild(controlDiv);

    currentRouteItems.forEach(function(item, index) {
        var label = document.createElement("label");
        label.className = "route-check-item";

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "routeCheckbox";
        checkbox.value = item.key;
        checkbox.checked = true;   

var fromName = getNodeDisplayName(item.from);
var toName = getNodeDisplayName(item.to);

var text = fromName + " - " + toName;

if (item.dist !== null && item.dist !== undefined) {
   text += "｜" + Number(item.dist).toFixed(1) + " 公里";
}
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + text));
        listBox.appendChild(label);
    });

    document.querySelectorAll(".routeCheckbox").forEach(function(cb) {
        cb.addEventListener("change", applyFilters);
    });

    document.getElementById("checkAllRoutes").addEventListener("click", function() {
        document.querySelectorAll(".routeCheckbox").forEach(function(cb) {
            cb.checked = true;
        });
        applyFilters();
    });

    document.getElementById("uncheckAllRoutes").addEventListener("click", function() {
        document.querySelectorAll(".routeCheckbox").forEach(function(cb) {
            cb.checked = false;
        });
        applyFilters();
    });

    applyFilters();
}

// 套用篩選
function applyFilters() {
    var selectedTown = document.getElementById("townSelect").value;
    var selectedRoute = document.getElementById("routeSelect").value;
    var showShelter = document.getElementById("shelterToggle").checked;
    var filteredBounds = L.latLngBounds();

    var checkedRouteKeys = new Set();
    document.querySelectorAll(".routeCheckbox:checked").forEach(function(cb) {
        checkedRouteKeys.add(cb.value);
    });

    // 點位圖層：依鄉鎮市篩選   
 pointLayerGroups.forEach(function(layerGroup) {
    layerGroup.eachLayer(function(featureLayer) {
        var props = featureLayer.feature && featureLayer.feature.properties ? featureLayer.feature.properties : {};
        var townValue = props["鄉鎮市"];

        var isShelterLayer = (layerGroup === layer___4);
        var visible = (selectedTown === "全部" || townValue === selectedTown);

        if (isShelterLayer && !showShelter) {
            visible = false;
        }

        if (visible) {
            if (!map.hasLayer(featureLayer)) {
                featureLayer.addTo(map);
            }

            if (featureLayer.getBounds) {
                filteredBounds.extend(featureLayer.getBounds());
            } else if (featureLayer.getLatLng) {
                filteredBounds.extend(featureLayer.getLatLng());
            }
        } else {
            if (map.hasLayer(featureLayer)) {
                map.removeLayer(featureLayer);
            }
        }
    });
});

    // 路線圖層：依鄉鎮市、路線類型、checkbox 篩選
    routeLayerGroups.forEach(function(routeGroup) {
        routeGroup.layer.eachLayer(function(featureLayer) {
            var props = featureLayer.feature && featureLayer.feature.properties ? featureLayer.feature.properties : {};

            var townValue = props["鄉鎮市"];
            var fromValue = props["FROM_ID"];
            var toValue = props["TO_ID"];
            var routeKey = routeGroup.type + "||" + fromValue + "||" + toValue;

            var townMatch = (selectedTown === "全部" || townValue === selectedTown);
            var routeTypeMatch = (selectedRoute === "全部" || selectedRoute === routeGroup.type);
            var checkboxMatch = checkedRouteKeys.has(routeKey);

            var visible = townMatch &&
                          routeTypeMatch &&
                          checkboxMatch &&
                          selectedRoute !== "不顯示";

            if (visible) {
                if (!map.hasLayer(featureLayer)) {
                    featureLayer.addTo(map);
                }

                if (featureLayer.getBounds) {
                    filteredBounds.extend(featureLayer.getBounds());
                }
            } else {
                if (map.hasLayer(featureLayer)) {
                    map.removeLayer(featureLayer);
                }
            }
        });
    });
    
if (filteredBounds.isValid()) {
    map.fitBounds(filteredBounds.pad(0.15));
}

updatePointLabels();
}

var sidebar = document.getElementById("sidebar");
var mapDiv = document.getElementById("map");
var resizer = document.getElementById("sidebarResizer");
var isResizing = false;

resizer.addEventListener("mousedown", function(e) {
    isResizing = true;
    document.body.style.cursor = "ew-resize";
    document.body.style.userSelect = "none";
});

document.addEventListener("mousemove", function(e) {
    if (!isResizing) return;

    var newWidth = e.clientX;
    var minWidth = 260;
    var maxWidth = 600;

    if (newWidth < minWidth) newWidth = minWidth;
    if (newWidth > maxWidth) newWidth = maxWidth;

    sidebar.style.width = newWidth + "px";
    mapDiv.style.left = newWidth + "px";

    map.invalidateSize();
});

document.addEventListener("mouseup", function() {
    if (isResizing) {
        isResizing = false;
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        map.invalidateSize();
    }
});
